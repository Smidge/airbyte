name: Anam Slack trial images
on:
  push:
    branches: [fix/slack-inaccessible-channels-checkpoints]
    paths:
      - airbyte-integrations/connectors/source-slack/**
      - .github/workflows/anam-slack-trial.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.repository == 'Smidge/airbyte'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [baseline, patched]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          sparse-checkout: airbyte-integrations/connectors/source-slack
      - name: Restore original source for baseline
        if: matrix.variant == 'baseline'
        run: |
          git show 8467589^:airbyte-integrations/connectors/source-slack/components.py > airbyte-integrations/connectors/source-slack/components.py
          git show 8467589^:airbyte-integrations/connectors/source-slack/manifest.yaml > airbyte-integrations/connectors/source-slack/manifest.yaml
      - name: Build and check image
        working-directory: airbyte-integrations/connectors/source-slack
        run: |
          docker build -f Dockerfile.trial -t ghcr.io/smidge/source-slack-trial:${{ github.sha }}-${{ matrix.variant }} .
          docker run --rm ghcr.io/smidge/source-slack-trial:${{ github.sha }}-${{ matrix.variant }} spec > /tmp/spec.jsonl
          python -c 'import json; assert any(json.loads(line).get("type") == "SPEC" for line in open("/tmp/spec.jsonl"))'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: docker push ghcr.io/smidge/source-slack-trial:${{ github.sha }}-${{ matrix.variant }}
