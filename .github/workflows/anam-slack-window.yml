name: Anam Slack history window trial
on:
  push:
    branches: [fix/slack-larger-history-windows]
    paths:
      - airbyte-integrations/connectors/source-slack/**
      - .github/workflows/anam-slack-window.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.repository == 'Smidge/airbyte'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: airbyte-integrations/connectors/source-slack
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify regressions and legacy migration
        working-directory: airbyte-integrations/connectors/source-slack
        run: |
          pip install 'airbyte-cdk==7.33.0' 'pytest==9.0.3' pytest-mock requests-mock freezegun mock
          python -m pytest unit_tests -q -k 'history_window or quiet_thread_parents or restart or partitions_skip_archived or state_migration'
      - name: Build and verify trial image
        working-directory: airbyte-integrations/connectors/source-slack
        run: |
          docker build -f Dockerfile.window-trial -t ghcr.io/smidge/source-slack:window-${{ github.sha }} .
          docker run --rm ghcr.io/smidge/source-slack:window-${{ github.sha }} spec > /tmp/spec.jsonl
          python -c 'import json; assert any(json.loads(line).get("type") == "SPEC" for line in open("/tmp/spec.jsonl"))'
      - name: Build image without trial instrumentation
        working-directory: airbyte-integrations/connectors/source-slack
        run: |
          docker build -f Dockerfile.window -t ghcr.io/smidge/source-slack:year-${{ github.sha }} .
          docker run --rm ghcr.io/smidge/source-slack:year-${{ github.sha }} spec > /tmp/year-spec.jsonl
          python -c 'import json; assert any(json.loads(line).get("type") == "SPEC" for line in open("/tmp/year-spec.jsonl"))'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish pinned trial image
        run: |
          docker push ghcr.io/smidge/source-slack:window-${{ github.sha }}
          docker push ghcr.io/smidge/source-slack:year-${{ github.sha }}
